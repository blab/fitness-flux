# The SARS-CoV-2 and H3N2 2025-26 datasets have enough sequence data
# to give good estimates, but clade designation has recently and there is
# effectively just a single circulating clade in 2026 for each. This gives
# an artificial small fitness flux. I'm waiting to include these for clades
# to be designated.

datasets:
  - sarscov2_clades_2020
  - sarscov2_clades_2020-21
  - sarscov2_clades_2021
  - sarscov2_clades_2021-22
  - sarscov2_clades_2022
  - sarscov2_clades_2022-23
  - sarscov2_clades_2023
  - sarscov2_clades_2023-24
  - sarscov2_clades_2024
  - sarscov2_clades_2024-25
  - sarscov2_clades_2025
  # - sarscov2_clades_2025-26
  - sarscov2_lineages_2020
  - sarscov2_lineages_2020-21
  - sarscov2_lineages_2021
  - sarscov2_lineages_2021-22
  - sarscov2_lineages_2022
  - sarscov2_lineages_2022-23
  - sarscov2_lineages_2023
  - sarscov2_lineages_2023-24
  - sarscov2_lineages_2024
  - sarscov2_lineages_2024-25
  - sarscov2_lineages_2025
  # - sarscov2_lineages_2025-26
  - h3n2_clades_2016-17
  - h3n2_clades_2017-18
  - h3n2_clades_2018-19
  - h3n2_clades_2019-20
  - h3n2_clades_2020-21
  - h3n2_clades_2021-22
  - h3n2_clades_2022-23
  - h3n2_clades_2023-24
  - h3n2_clades_2024-25
  # - h3n2_clades_2025-26
  # h1n1pdm_clades_2016-17 is a single clade (only "unassigned" in the USA) so
  # MLR cannot fit it; excluded. 2017-18 and 2018-19 are dominated by the
  # paraphyletic "unassigned" bucket with thin real-clade signal (flagged as
  # candidates to drop on follow-up review).
  - h1n1pdm_clades_2018-19
  - h1n1pdm_clades_2019-20
  - h1n1pdm_clades_2020-23
  # - h1n1pdm_clades_2021-22
  - h1n1pdm_clades_2022-23
  - h1n1pdm_clades_2023-24
  - h1n1pdm_clades_2024-25
  - vic_clades_2016-17
  - vic_clades_2017-18
  - vic_clades_2018-19
  - vic_clades_2019-20
  - vic_clades_2020-21
  # vic_clades_2021-22 collapses to a single "other" clade in the USA (COVID-era
  # sampling / nomenclature gap between the A.3.2 and C.5 eras), so MLR cannot fit
  # it; excluded, leaving a one-window gap in the Vic series.
  # - vic_clades_2021-22
  - vic_clades_2022-23
  - vic_clades_2023-24
  - vic_clades_2024-25

# Per-virus metadata provisioning (the provision_metadata rule): stream the
# Nextstrain metadata from S3, subset to these columns, and recompress to the
# data/{virus}_subset_metadata.tsv.zst that every dataset block's local_metadata
# points at. H3N2 is a private bucket (needs AWS credentials); SARS-CoV-2 is public.
provision:
  sarscov2:
    metadata_url: "s3://nextstrain-data/files/ncov/open/metadata.tsv.zst"
    decompress: "zstd -dc"
    columns: "strain,date,country,clade_nextstrain,Nextclade_pango,QC_overall_status"
    merge_clades:
      clade_nextstrain:
        WT: ["19A", "19B"]
  h3n2:
    metadata_url: "s3://nextstrain-data-private/files/workflows/seasonal-flu/h3n2/metadata.tsv.xz"
    decompress: "xz -dc"
    columns: "strain,date,country,subclade_nextclade_ha,qc.overallStatus_ha"
  h1n1pdm:
    metadata_url: "s3://nextstrain-data-private/files/workflows/seasonal-flu/h1n1pdm/metadata.tsv.xz"
    decompress: "xz -dc"
    columns: "strain,date,country,subclade_nextclade_ha,qc.overallStatus_ha"
  vic:
    metadata_url: "s3://nextstrain-data-private/files/workflows/seasonal-flu/vic/metadata.tsv.xz"
    decompress: "xz -dc"
    columns: "strain,date,country,subclade_nextclade_ha,qc.overallStatus_ha"

# Generation time (days) to convert per-day MLR growth rates to per-generation
# fitness. SARS-CoV-2 splits by Omicron status (assigned per variant at fit time
# by scripts/generation_time.py); H3N2 uses a single value. Resolved per dataset
# by virus prefix in the MLR and fitness-flux rules.
generation_time:
  sarscov2:
    pre_omicron: 5.0
    post_omicron: 3.2
  h3n2: 3.2
  h1n1pdm: 3.2
  vic: 3.2

# Nextclade SARS-CoV-2 reference tree used to count per-Pango-lineage amino-acid
# mutations (the mutation_counts rules, feeding the lineage-deltas analysis).
# Re-fetch with `--forcerun fetch_nextclade_pango` to pick up newly defined lineages.
mutation_counts:
  nextclade_url: "https://nextstrain.org/nextclade/nextstrain/sars-cov-2/wuhan-hu-1/orfs"

# H3N2 uses a 2-year analysis window and slides 1-year forward, and a 2-week
# (14-day) empirical-frequency smoothing window (raw_freq_window) since it is
# sparser than SARS-CoV-2, which stays at the 1-week default.

h3n2_clades_2016-17:
  local_metadata: "data/h3n2_subset_metadata.tsv.zst"
  seq_count_options: >-
    --clade-column subclade_nextclade_ha
    --filter-columns country
    --filter-query "country == 'USA'"
    --location-column country
  min_date: "2016-01-01"
  max_date: "2017-12-31"
  clade_min_count: 50
  clade_min_freq: 0.001
  pivot: "B.1"
  raw_freq_window: 14

