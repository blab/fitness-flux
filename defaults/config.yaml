provision:
  sarscov2:
    metadata_url: "s3://nextstrain-data/files/ncov/open/metadata.tsv.zst"
    decompress: "zstd -dc"
    no_sign_request: true  # public bucket; fetch unsigned (no AWS creds needed)
    columns: "strain,date,country,region,clade_nextstrain,Nextclade_pango,QC_overall_status"
    merge_clades:
      clade_nextstrain:
        WT: ["19A", "19B"]
  h3n2:
    metadata_url: "s3://nextstrain-data-private/files/workflows/seasonal-flu/h3n2/metadata.tsv.xz"
    decompress: "xz -dc"
    columns: "strain,date,country,region,subclade_nextclade_ha,qc.overallStatus_ha"
  h1n1pdm:
    metadata_url: "s3://nextstrain-data-private/files/workflows/seasonal-flu/h1n1pdm/metadata.tsv.xz"
    decompress: "xz -dc"
    columns: "strain,date,country,region,subclade_nextclade_ha,qc.overallStatus_ha"
  vic:
    metadata_url: "s3://nextstrain-data-private/files/workflows/seasonal-flu/vic/metadata.tsv.xz"
    decompress: "xz -dc"
    columns: "strain,date,country,region,subclade_nextclade_ha,qc.overallStatus_ha"

# Generation time (days) to convert per-day MLR growth rates to per-generation
# fitness. SARS-CoV-2 splits by Omicron status (assigned per variant at fit time
# by scripts/generation_time.py); H3N2 uses a single value. Resolved per dataset
# by virus prefix in the MLR and fitness-flux rules.
generation_time:
  sarscov2:
    pre_omicron: 5.0
    post_omicron: 3.2
  h3n2: 3.2
  h1n1pdm: 3.2
  vic: 3.2

# Nextclade SARS-CoV-2 reference tree used to count per-Pango-lineage amino-acid
# mutations (the mutation_counts rules, feeding the lineage-deltas analysis).
# Re-fetch with `--forcerun fetch_nextclade_pango` to pick up newly defined lineages.
mutation_counts:
  nextclade_url: "https://nextstrain.org/nextclade/nextstrain/sars-cov-2/wuhan-hu-1/orfs"

# All clade datasets slide forward every 3 months (quarterly), labeled by window
# start month (YYYY-MM). SARS-CoV-2 uses 1-year windows; flu uses 2-year windows
# (sparser data, slower dynamics, and to bridge more of the 2020-2022 COVID trough).
# Per-window pivots are omitted: evofr uses the "other" reference and scaffolding
# removes per-window offsets, so the reference choice does not affect scaffolded
# fitness. Unfittable windows (a single clade, or a window entirely within the COVID
# trough for flu) are omitted from the datasets list above. Flu uses a 2-week (14-day)
# empirical-frequency smoothing window; SARS-CoV-2 keeps the 1-week default.

_sarscov2_clades: &sarscov2_clades
  local_metadata: "data/sarscov2_merged_metadata.tsv.zst"
  seq_count_options: >-
    --clade-column clade_nextstrain
    --filter-columns QC_overall_status region
    --filter-query "QC_overall_status != 'bad' & region != '?'"
    --location-column region
  clade_min_count: 50
  clade_min_freq: 0.001
  location_min_seq: 500

_h3n2_clades: &h3n2_clades
  local_metadata: "data/h3n2_subset_metadata.tsv.zst"
  seq_count_options: >-
    --clade-column subclade_nextclade_ha
    --filter-columns region
    --filter-query "region != '?'"
    --location-column region
  clade_min_count: 50
  clade_min_freq: 0.001
  raw_freq_window: 14
  location_min_seq: 500

_h1n1pdm_clades: &h1n1pdm_clades
  local_metadata: "data/h1n1pdm_subset_metadata.tsv.zst"
  seq_count_options: >-
    --clade-column subclade_nextclade_ha
    --filter-columns region
    --filter-query "region != '?'"
    --location-column region
  clade_min_count: 50
  clade_min_freq: 0.001
  raw_freq_window: 14
  location_min_seq: 500

_vic_clades: &vic_clades
  local_metadata: "data/vic_subset_metadata.tsv.zst"
  seq_count_options: >-
    --clade-column subclade_nextclade_ha
    --filter-columns region
    --filter-query "region != '?'"
    --location-column region
  clade_min_count: 50
  clade_min_freq: 0.001
  raw_freq_window: 14
  location_min_seq: 500

