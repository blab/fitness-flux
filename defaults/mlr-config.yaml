# These data options are over-ridden when calling run-mlr-model.py but are expected by MLRConfig
data:
  name: "Test" # Model name
  case_path: "data/test/prepared_cases.tsv"
  seq_path: "data/test/prepared_seq_counts.tsv"

settings:
  fit: true # Fit the model?
  save: false # Save model state?
  load: false # Load old model?
  export_json: true  # Export model results as json
  ps: [0.5, 0.8, 0.95] # HPDI intervals to be exported

model:
  # Fallback only; production generation time comes from the top-level
  # `generation_time` block in config.yaml, passed per dataset via
  # --generation-time / --generation-time-pre-omicron.
  generation_time: 4.8
  # Empty => evofr auto-selects the "other" bucket as the beta=0 reference. Per-window
  # pivots were removed from config.yaml; scaffolding removes per-window offsets, so the
  # reference choice does not affect scaffolded fitness. (A real clade like "20A" here
  # would otherwise silently become the reference for windows that lack a --pivot.)
  pivot: ""
  hierarchical: true
  # Cross-region partial-pooling strength for the hierarchical model (HierMLR): each
  # region's per-variant growth advantage is drawn Normal(shared_mean, pool_scale).
  # Smaller => stronger shrinkage toward the across-region consensus. evofr's default
  # is 0.1; 0.25 matches the forecasts-flu config. Only matters with >1 region.
  pool_scale: 0.25

inference:
  method: "NUTS"
  iters: 50000 # Number of iterations for SVI
  lr: 4e-4 # Learning rate for the model
  num_warmup: 200
  num_samples: 200
