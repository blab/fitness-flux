<!doctype html>
<meta charset="utf-8" />
<title>Fitness flux through time</title>
<style>
    html, body { margin: 0; }
    #fig { width: 100vw; height: 100vh; }
</style>
<div id="fig"></div>
<script type="module">
    import { render } from "./time-vs-fitness.js";
    const slot = document.getElementById("fig");
    const meta = await fetch("./meta.json").then((r) => r.json()).catch(() => null);
    const params = new URLSearchParams(location.search);
    const id = params.get("dataset") ?? meta?.default ?? "sarscov2_clades";
    const data = await fetch(`./data/${id}.json`).then((r) => r.json());
    const fig = render(slot, data, { mode: "slide", regressions: params.get("regressions") ?? undefined });
    new ResizeObserver(() => fig.resize()).observe(slot);
</script>
